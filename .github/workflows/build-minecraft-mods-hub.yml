name: Build Minecraft Mods Hub APK
on:
  push:
    branches: [ main, master ]
    paths:
      - 'MinecraftModsHub/**'
      - '.github/workflows/build-minecraft-mods-hub.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        run: gradle -p MinecraftModsHub assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mods-Hub-debug-apk
          path: MinecraftModsHub/app/build/outputs/apk/debug/app-debug.apk
